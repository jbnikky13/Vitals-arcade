<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solve in Seconds · Vitals Arcade</title><link rel="stylesheet" href="../../shared/arcade-theme.css"></head><body><main><nav class="arcade-nav"><div class="game-brand">VITALS <span>ARCADE</span></div><button class="home-btn" onclick="location.href='../../'">← Arcade</button></nav><section class="game-card"><h1 class="game-title">⏱ Solve in Seconds</h1><p class="game-sub">Fast logic, number and pattern puzzles. Each run draws a new set.</p><div id="meta" class="meta"></div><div class="progress-bar"><i id="bar"></i></div><section class="question-card" style="text-align:center"><div id="cat" class="muted"></div><div id="q" style="font-size:clamp(28px,8vw,48px);font-weight:800;margin:28px 0"></div><input id="a" class="answer-input" inputmode="decimal" placeholder="Your answer"><br><br><button id="go" class="arcade-btn">SOLVE</button><div id="result"></div></section></section></main><script src="../../shared/arcade-state.js"></script><script>
const BANK=[['NUMBER PATTERN','2, 6, 12, 20, 30, ?','42','Multiply n by n+1.'],['EQUATION','3 + 3 × 4 = ?','15','Multiplication first.'],['NUMBER PATTERN','5, 10, 20, 40, ?','80','Each number doubles.'],['LOGIC','Clock at 3:15: smaller angle?','7.5','The hour hand is 7.5° past 3.'],['PATTERN','1, 1, 2, 3, 5, 8, ?','13','Add the previous two.'],['MATH','4 pencils cost ₦120. 7 cost?','210','One pencil costs ₦30.'],['NUMBER PATTERN','81, 27, 9, 3, ?','1','Divide by 3.'],['WORD LOGIC','Odd number. Remove one letter and I become even.','seven','SEVEN minus S becomes EVEN.'],['EQUATION','12 ÷ 3 + 2 × 5 = ?','14','4 + 10 = 14.'],['PATTERN','3, 6, 11, 18, 27, ?','38','Differences increase by 2.'],['MATH','25% of 240 = ?','60','One quarter of 240.'],['EQUATION','18 - 6 ÷ 2 = ?','15','Division before subtraction.'],['PATTERN','4, 8, 14, 22, 32, ?','44','Add 4,6,8,10,12.'],['LOGIC','A dozen eggs minus 5 equals?','7','12 - 5 = 7.'],['MATH','If 3 books cost ₦900, 5 cost?','1500','Each costs ₦300.'],['PATTERN','2, 3, 5, 8, 12, ?','17','Add 1,2,3,4,5.'],['EQUATION','7 × 6 - 10 = ?','32','42 - 10 = 32.'],['NUMBER PATTERN','64, 32, 16, 8, ?','4','Divide by 2.'],['LOGIC','If all bloops are razzies and all razzies are green, are bloops green?','yes','The relationship is transitive.'],['MATH','10% of 450 = ?','45','0.1 × 450.'],['PATTERN','1, 4, 10, 19, 31, ?','46','Add 3,6,9,12,15.'],['EQUATION','5 + 2 × 7 - 3 = ?','16','14 + 5 - 3.'],['MATH','A ₦200 item is 25% off. Price?','150','25% of 200 is 50.'],['PATTERN','10, 13, 19, 28, 40, ?','55','Add 3,6,9,12,15.'],['LOGIC','How many months have 28 days?','12','Every month has at least 28 days.'],['MATH','6 workers finish a job in 10 days. At same rate, 3 workers need?','20','Half the workers means twice the time.'],['NUMBER PATTERN','3, 9, 27, 81, ?','243','Multiply by 3.'],['EQUATION','100 ÷ 4 + 7 = ?','32','25 + 7.'],['PATTERN','2, 5, 10, 17, 26, ?','37','Add consecutive odd numbers.'],['LOGIC','You have 3 apples and take 2. How many do you have?','2','You took 2.']];
let puzzles=[],n=0,score=0,locked=false,timer;const $=id=>document.getElementById(id);function norm(x){return x.trim().toLowerCase().replace(/[₦,$,\s,°]/g,'')}function start(){locked=false;const p=puzzles[n];$('meta').textContent='ROUND '+(n+1)+' / '+puzzles.length+' · SCORE '+score;$('bar').style.width=(n/puzzles.length*100)+'%';$('cat').textContent=p[0];$('q').textContent=p[1];$('a').value='';$('result').innerHTML='';$('go').disabled=false;$('a').focus();clearTimeout(timer);$('bar').style.transition='none';requestAnimationFrame(()=>{$('bar').style.transition='width 10s linear';$('bar').style.width='0%'});timer=setTimeout(()=>finish(false),10000)}function finish(ok){if(locked)return;locked=true;clearTimeout(timer);$('go').disabled=true;if(ok)score+=100;const p=puzzles[n];$('result').innerHTML='<div class="result"><b class="'+(ok?'ok':'bad')+'">'+(ok?'✓ CORRECT':'✕ NOT QUITE')+'</b><p>Answer: <b>'+p[2]+'</b></p><p class="muted">'+p[3]+'</p><button class="arcade-btn alt" onclick="next()">'+(n===puzzles.length-1?'FINISH':'NEXT')+'</button></div>';if(window.VitalsArcade)VitalsArcade.recordGame('solve-in-seconds',score,ok)}function next(){n++;if(n<puzzles.length)start();else done()}function done(){$('bar').style.width='100%';$('cat').textContent='CHALLENGE COMPLETE';$('q').textContent=score+' POINTS';$('a').remove();$('go').remove();$('result').innerHTML='<div class="result"><b class="ok">⚡ COMPLETE</b><p>Fresh puzzle set ready for the next run.</p><button class="arcade-btn alt" onclick="location.reload()">PLAY AGAIN</button></div>'}puzzles=[...BANK].sort(()=>Math.random()-.5).slice(0,10);$('go').onclick=()=>finish(puzzles[n][2]===norm($('a').value));$('a').onkeydown=e=>{if(e.key==='Enter')$('go').click()};start();
</script></body></html>
