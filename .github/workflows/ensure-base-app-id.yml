name: Ensure Base App ID

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-base-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Base App ID meta tag in homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<meta name="base:app_id" content="6a9d0c60eae4ee0ceaa644b9" />'
          if 'name="base:app_id"' not in s:
              marker = '<meta name="viewport"'
              pos = s.find(marker)
              if pos == -1:
                  raise SystemExit('Could not find homepage <head> viewport meta tag')
              end = s.find('>', pos)
              if end == -1:
                  raise SystemExit('Could not find viewport meta tag end')
              s = s[:end+1] + '\n' + tag + s[end+1:]
              p.write_text(s, encoding='utf-8')
              print('Inserted Base App ID meta tag')
          else:
              print('Base App ID meta tag already present')
          PY

      - name: Integrate Pong and Solve in Seconds
        run: python scripts/integrate-new-games.py

      - name: Commit homepage and hub changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage or hub changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Pong and Solve in Seconds to game hub'
          git push
