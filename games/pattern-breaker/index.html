<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Breaker · Vitals Arcade</title><style>body{margin:0;background:#081620;color:#eaf2f2;font-family:system-ui;text-align:center}main{max-width:650px;margin:auto;padding:24px}.card{margin-top:35px;padding:28px 18px;background:#12293b;border:1px solid #24455c;border-radius:16px}.q{font-size:38px;font-weight:800;margin:30px 0}.opt{display:block;width:100%;margin:8px 0;padding:14px;border:1px solid #24455c;border-radius:10px;background:#17324a;color:#fff;font-weight:700}.muted{color:#7f98a3}</style></head><body><main><button onclick="location.href='../../'">← Arcade</button><div class="card"><div id="meta" class="muted"></div><div id="q" class="q"></div><div id="opts"></div><div id="out"></div></div></main><script src="../../shared/arcade-state.js"></script><script>const rounds=[['2, 4, 8, 16, ?',['24','32','36','40'],'32'],['3, 6, 11, 18, 27, ?',['34','36','38','40'],'38'],['1, 4, 9, 16, ?',['20','24','25','27'],'25'],['5, 9, 15, 23, ?',['31','32','33','34'],'33'],['7, 14, 28, 56, ?',['84','96','112','120'],'112']];let i=0,score=0;function show(){const r=rounds[i];document.getElementById('meta').textContent=`ROUND ${i+1}/${rounds.length} · SCORE ${score}`;document.getElementById('q').textContent=r[0];document.getElementById('out').innerHTML='';document.getElementById('opts').innerHTML=r[1].map(x=>`<button class="opt" onclick="pick('${x}')">${x}</button>`).join('')}function pick(x){const r=rounds[i],ok=x===r[2];if(ok)score+=100;document.getElementById('out').innerHTML=`<p class="${ok?'':'muted'}"><b>${ok?'✓ CORRECT':'✕ WRONG'}</b> · Answer ${r[2]}</p>`;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);if(window.VitalsArcade)VitalsArcade.recordGame('pattern-breaker',score,ok);setTimeout(()=>{i++;if(i<rounds.length)show();else{document.getElementById('q').textContent=`${score} POINTS`;document.getElementById('opts').innerHTML='<button class="opt" onclick="location.reload()">PLAY AGAIN</button>';document.getElementById('out').textContent='Challenge complete.'}},700)}show();</script></body></html>
