<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Number Merge · Vitals Arcade</title><link rel="stylesheet" href="../../shared/arcade-theme.css"><style>
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:18px auto}.tile{aspect-ratio:1;border:3px solid var(--arc-ink);border-radius:14px;background:#4cc9f0;color:var(--arc-ink);font-size:clamp(18px,7vw,30px);font-weight:800;box-shadow:3px 3px 0 var(--arc-ink)}.tile.v2{background:#fff3a8}.tile.v4{background:#3ddc97}.tile.v8{background:#ff8fc7}.tile.v16{background:#b28dff}.tile.v32,.tile.v64{background:#ff6b5e;color:#fff}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:7px;justify-content:center;margin:12px auto}.controls button{height:48px;border:3px solid var(--arc-ink);border-radius:12px;background:var(--arc-paper);font-weight:800;box-shadow:3px 3px 0 var(--arc-ink)}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3;grid-row:2}
</style></head><body><main><nav class="arcade-nav"><div class="game-brand">VITALS <span>ARCADE</span></div><button class="home-btn" onclick="location.href='../../'">← Arcade</button></nav><section class="game-card"><h1 class="game-title">Number Merge</h1><p class="game-sub">Slide the tiles, merge matching numbers, and reach 128.</p><div class="meta">TARGET <b id="target">128</b> · SCORE <b id="score">0</b></div><div id="grid" class="grid"></div><div class="controls"><button class="up" data-dir="U">↑</button><button class="left" data-dir="L">←</button><button class="down" data-dir="D">↓</button><button class="right" data-dir="R">→</button></div><div id="out"></div><button class="arcade-btn alt" onclick="reset()">NEW GAME</button></section></main><script src="../../shared/arcade-state.js"></script><script>
let board,score,target=128,over=false;const $=id=>document.getElementById(id);
function reset(){board=Array(16).fill(0);score=0;over=false;add();add();render()}
function add(){const z=board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(z.length)board[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}
function collapse(line){const a=line.filter(Boolean),out=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){const v=a[i]*2;out.push(v);score+=v;i++}else out.push(a[i])}while(out.length<4)out.push(0);return out}
function move(dir){if(over)return;const before=board.join(',');if(dir==='L'||dir==='R'){for(let r=0;r<4;r++){let row=board.slice(r*4,r*4+4);if(dir==='R')row.reverse();row=collapse(row);if(dir==='R')row.reverse();for(let c=0;c<4;c++)board[r*4+c]=row[c]}}else{for(let c=0;c<4;c++){let col=[board[c],board[c+4],board[c+8],board[c+12]];if(dir==='D')col.reverse();col=collapse(col);if(dir==='D')col.reverse();for(let r=0;r<4;r++)board[r*4+c]=col[r]}}if(before!==board.join(',')){add();render();if(board.includes(target)){over=true;$('out').innerHTML='<div class="result"><b class="ok">🎉 TARGET REACHED!</b><p>Score: '+score+'</p><button class="arcade-btn" onclick="reset()">PLAY AGAIN</button></div>';if(window.VitalsArcade)VitalsArcade.recordGame('number-merge',score,true)}else if(!canMove()){over=true;$('out').innerHTML='<div class="result"><b class="bad">NO MORE MOVES</b><p>Score: '+score+'</p><button class="arcade-btn" onclick="reset()">TRY AGAIN</button></div>'}}}
function canMove(){for(let i=0;i<16;i++){if(board[i]===0)return true;const r=Math.floor(i/4),c=i%4;if(c<3&&board[i]===board[i+1])return true;if(r<3&&board[i]===board[i+4])return true}return false}
function render(){$('score').textContent=score;$('grid').innerHTML=board.map(v=>'<div class="tile '+(v?'v'+v:'')+'">'+(v||'')+'</div>').join('')}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.dir)));
document.addEventListener('keydown',e=>{const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[e.key];if(m){e.preventDefault();move(m)}});
let sx=0,sy=0;document.getElementById('grid').addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});document.getElementById('grid').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))},{passive:true});reset();
</script></body></html>
