name: Arcade Hub Integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/integrate_arcade.py'
      - 'shared/**'
      - 'games/**'
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message != 'ci: apply arcade hub integration [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/integrate_arcade.py
      - name: Commit integration if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No hub changes needed.'
          else
            git add index.html
            git commit -m 'ci: apply arcade hub integration [skip ci]'
            git push
          fi
