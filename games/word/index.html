<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Rush · Vitals Arcade</title><link rel="stylesheet" href="../../shared/arcade-theme.css"></head><body><main><nav class="arcade-nav"><div class="game-brand">VITALS <span>ARCADE</span></div><button class="home-btn" onclick="location.href='../../'">← Arcade</button></nav><section class="game-card"><h1 class="game-title">Aa Word Rush</h1><p class="game-sub">Unscramble a fresh set of words. No word repeats in a run.</p><div id="meta" class="meta"></div><div class="question-card" style="text-align:center"><div class="muted">UNSCRAMBLE</div><div id="word" style="font-size:clamp(34px,10vw,60px);font-weight:900;letter-spacing:6px;margin:28px 0"></div><input id="answer" class="answer-input" autocomplete="off" placeholder="Type the word"><br><br><button id="submit" class="arcade-btn">SOLVE</button><div id="result"></div></div></section></main><script src="../../shared/arcade-state.js"></script><script>
const BANK=['EARTH','APPLE','LIGHT','WATER','TRAIN','SMILE','STONE','CLOUD','BRAIN','PLANT','MUSIC','RIVER','HOUSE','TIGER','ORANGE','GARDEN','WINDOW','SUMMER','OCEAN','ROCKET','PLANET','FRIEND','MARKET','BUTTON','CAMERA','PUZZLE','COOKIE','FOREST','SCHOOL','FLOWER'],'BREAD','BRAVE','CHAIR','DREAM','EAGLE','FIELD','GLASS','GREEN','HEART','HOUSE','JUICE','KNIFE','LEMON','METAL','NIGHT','PAPER','PEACH','PHONE','PLANE','QUEEN','RAINBOW','SCHOOL','SHOES','SNAKE','SPACE','SPOON','STORM','TABLE','THUMB','TOAST','TRAIN','TRUCK','WATCH','WHALE','WHEEL','WORLD','YOUTH','ZEBRA','BOTTLE','BRIDGE','CASTLE','CIRCLE','DRAGON','ENGINE','FINGER','GUITAR','HAMMER','ISLAND','JACKET','KITTEN','LADDER','MARBLE','MIRROR','MOUSE','NURSE','PENCIL','PILLOW','PIZZA','RABBIT','ROBOT','SILVER','SINGER','SKY','SMOOTH','SPRING','STATION','SUNSET','TICKET','TOMATO','TURTLE','VALLEY','VILLAGE','WINTER','WINDOW','YELLOW']let words=[],n=0,score=0,locked=false;const $=id=>document.getElementById(id);function shuffle(s){let a=s.split('');for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}const out=a.join('');return out===s?shuffle(s):out}function start(){locked=false;const p=words[n];$('meta').textContent='ROUND '+(n+1)+' / '+words.length+' · SCORE '+score;$('word').textContent=shuffle(p);$('answer').value='';$('result').innerHTML='';$('submit').disabled=false;$('answer').focus()}function submit(){if(locked)return;locked=true;$('submit').disabled=true;const p=words[n],ok=$('answer').value.trim().toUpperCase()===p;if(ok)score+=100;$('result').innerHTML='<div class="result"><b class="'+(ok?'ok':'bad')+'">'+(ok?'✓ CORRECT':'✕ NOT QUITE')+'</b><p>Answer: <b>'+p+'</b></p><button class="arcade-btn alt" onclick="next()">'+(n===words.length-1?'FINISH':'NEXT')+'</button></div>';if(window.VitalsArcade)VitalsArcade.recordGame('word-rush',score,ok)}
function next(){n++;if(n<words.length)start();else done()}function done(){$('word').textContent=score+' XP';$('answer').remove();$('submit').remove();$('meta').textContent='CHALLENGE COMPLETE';$('result').innerHTML='<div class="result"><b class="ok">WORD RUSH COMPLETE</b><p>Fresh word pool ready for the next run.</p><button class="arcade-btn alt" onclick="location.reload()">PLAY AGAIN</button></div>'}
words=[...BANK].sort(()=>Math.random()-.5).slice(0,10);$('submit').onclick=submit;$('answer').onkeydown=e=>{if(e.key==='Enter')submit()};start();
</script></body></html>
