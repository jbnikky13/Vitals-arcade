<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss Quiz · Vitals Arcade</title><link rel="stylesheet" href="../../shared/arcade-theme.css"></head><body><main><nav class="arcade-nav"><div class="game-brand">VITALS <span>ARCADE</span></div><button class="home-btn" onclick="location.href='../../'">← Arcade</button></nav><section class="game-card"><h1 class="game-title">👑 Boss Quiz</h1><p class="game-sub">A fresh set of questions every time you play. No repeats within a run.</p><div id="meta" class="meta"></div><div class="progress-bar"><i id="bar"></i></div><div class="question-card"><div id="q"></div><div id="opts"></div><div id="out"></div></div></section></main><script src="../../shared/arcade-state.js"></script><script>
const BANK=[
['What is the capital of Nigeria?',['Lagos','Abuja','Kano','Ibadan'],'Abuja'],['Which planet is known as the Red Planet?',['Venus','Mars','Jupiter','Mercury'],'Mars'],['What is 12 × 8?',['86','92','96','108'],'96'],['Which number is prime?',['21','27','29','33'],'29'],['Which word is closest to “rapid”?',['Slow','Quick','Quiet','Late'],'Quick'],['How many sides does a hexagon have?',['5','6','7','8'],'6'],['What is 15% of 200?',['20','25','30','35'],'30'],['Which ocean is the largest?',['Atlantic','Indian','Pacific','Arctic'],'Pacific'],['What gas do plants absorb?',['Oxygen','Nitrogen','Carbon dioxide','Helium'],'Carbon dioxide'],['What is 9²?',['18','72','81','99'],'81'],['Which continent is Egypt in?',['Asia','Africa','Europe','South America'],'Africa'],['What is the next prime after 11?',['12','13','14','15'],'13'],['Which instrument has keys, pedals and strings?',['Violin','Piano','Flute','Trumpet'],'Piano'],['How many minutes are in 2 hours?',['60','90','120','180'],'120'],['Which shape has three sides?',['Square','Triangle','Circle','Pentagon'],'Triangle'],['What is 7 × 9?',['56','63','72','81'],'63'],['Which is a mammal?',['Shark','Dolphin','Trout','Octopus'],'Dolphin'],['What is the chemical symbol for gold?',['Ag','Au','Fe','Gd'],'Au'],['Which planet is closest to the Sun?',['Earth','Mars','Mercury','Venus'],'Mercury'],['What is half of 3/4?',['1/8','1/4','3/8','2/3'],'3/8'],['Which language is primarily spoken in Brazil?',['Spanish','Portuguese','French','Italian'],'Portuguese'],['How many bytes are in a kilobyte in the common decimal convention?',['100','1000','1024','2048'],'1000'],['What is 144 ÷ 12?',['10','11','12','14'],'12'],['Which metal is liquid at room temperature?',['Iron','Mercury','Copper','Aluminium'],'Mercury'],['What is the largest internal organ in the human body?',['Heart','Liver','Lung','Kidney'],'Liver'],['Which direction does the sun rise from?',['North','South','East','West'],'East'],['What is 2⁵?',['10','16','25','32'],'32'],['Which number is divisible by 3?',['22','25','28','33'],'33'],['What is the freezing point of water in Celsius?',['0','10','32','100'],'0'],['Which planet has the most famous ring system?',['Mars','Saturn','Earth','Venus'],'Saturn'],['How many colors are traditionally in a rainbow?',['5','6','7','8'],'7']
];
let qs=[],i=0,score=0,lives=3;
function sample(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}
function show(){const q=qs[i];$('meta').textContent='ROUND '+(i+1)+' / '+qs.length+' · ❤️ '+lives+' · SCORE '+score;$('bar').style.width=((i)/qs.length*100)+'%';$('q').innerHTML='<h2>'+q[0]+'</h2>';$('opts').innerHTML=q[1].sort(()=>Math.random()-.5).map(x=>'<button class="choice">'+x+'</button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(b.textContent))}
function pick(x){const q=qs[i],ok=x===q[2];if(ok)score+=100;else lives--;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('out').innerHTML='<div class="result"><b class="'+(ok?'ok':'bad')+'">'+(ok?'✓ CORRECT':'✕ WRONG')+'</b> · Answer: <b>'+q[2]+'</b></div>';if(window.VitalsArcade)VitalsArcade.recordGame('boss-quiz',score,ok);setTimeout(()=>{if(lives<=0||i===qs.length-1)done();else{i++;show()}},650)}
function done(){$('bar').style.width='100%';$('q').innerHTML='<h2>'+(lives>0?'🏆 BOSS DEFEATED!':'💥 BOSS WINS')+'</h2>';$('opts').innerHTML='<button class="arcade-btn alt" onclick="location.reload()">NEW BATTLE</button>';$('out').innerHTML='<div class="result">Final score: <b>'+score+'</b><p class="muted">The question bank is randomized, so the next battle uses a different set.</p></div>'}
const $=id=>document.getElementById(id);qs=sample(BANK,8);show();
</script></body></html>
