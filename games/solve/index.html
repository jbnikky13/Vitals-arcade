<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solve in Seconds · Vitals Arcade</title><style>body{margin:0;background:#081620;color:#eaf2f2;font-family:system-ui;text-align:center}main{max-width:640px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.card{margin-top:25px;background:#12293b;border:1px solid #24455c;border-radius:16px;padding:30px 18px;min-height:400px}.question{font-size:clamp(30px,8vw,48px);font-weight:800;margin:35px 0}.answer{padding:13px;border-radius:10px;background:#081620;color:white;border:2px solid #24455c;font-size:18px;text-align:center}.submit,.next{padding:13px 22px;border:0;border-radius:10px;background:#8fe3c1;font-weight:800}.result{margin-top:20px;padding:16px;border:1px solid #24455c;border-radius:12px}.correct{color:#8fe3c1}.wrong{color:#ff5a4e}.muted{color:#7f98a3}.timer{height:6px;background:#101c25;margin:15px 0}.timer i{display:block;height:100%;width:100%;background:#8fe3c1;transition:width 10s linear}</style></head><body><main><header class="top"><b>VITALS ARCADE</b><button onclick="location.href='../../'">←</button></header><div id="meta" class="muted"></div><div class="timer"><i id="bar"></i></div><section class="card"><div id="cat" class="muted"></div><div id="q" class="question"></div><input id="a" class="answer" inputmode="decimal" placeholder="Your answer"><button id="go" class="submit">SOLVE</button><div id="result"></div></section></main><script src="../../shared/arcade-state.js"></script><script>const puzzles=[['NUMBER PATTERN','2, 6, 12, 20, 30, ?','42','n × (n + 1), so 6×7 = 42.'],['EQUATION','3 + 3 × 4 = ?','15','Multiplication first: 3×4=12, then +3 = 15.'],['NUMBER PATTERN','5, 10, 20, 40, ?','80','Each number doubles.'],['LOGIC','Clock at 3:15: smaller angle?','7.5','The hour hand is 7.5° past 3, so the difference is 7.5°.'],['PATTERN','1, 1, 2, 3, 5, 8, ?','13','Each term is the sum of the previous two.'],['MATH','4 pencils cost ₦120. 7 cost?','210','One pencil is ₦30; 7 cost ₦210.'],['NUMBER PATTERN','81, 27, 9, 3, ?','1','Divide by 3 each time.'],['WORD LOGIC','Odd number. Remove one letter and I become even.','seven','SEVEN minus S gives EVEN.'],['EQUATION','12 ÷ 3 + 2 × 5 = ?','14','4 + 10 = 14.'],['PATTERN','3, 6, 11, 18, 27, ?','38','Differences are +3,+5,+7,+9,+11.']];let n=0,score=0,locked=false,timer;const $=x=>document.getElementById(x);function norm(x){return x.trim().toLowerCase().replace(/[₦,$,\s,°]/g,'')}function start(){locked=false;const p=puzzles[n];$('meta').textContent=`ROUND ${n+1} / ${puzzles.length} · SCORE ${score}`;$('cat').textContent=p[0];$('q').textContent=p[1];$('a').value='';$('result').innerHTML='';$('go').disabled=false;$('a').focus();$('bar').style.transition='none';$('bar').style.width='100%';requestAnimationFrame(()=>{$('bar').style.transition='width 10s linear';$('bar').style.width='0%'});clearTimeout(timer);timer=setTimeout(()=>finish(false),10000)}function finish(ok){if(locked)return;locked=true;clearTimeout(timer);$('go').disabled=true;if(ok)score+=100;$('meta').textContent=`ROUND ${n+1} / ${puzzles.length} · SCORE ${score}`;if(window.VitalsArcade)VitalsArcade.recordGame('solve-in-seconds',score,ok);const p=puzzles[n];$('result').innerHTML=`<div class="result"><b class="${ok?'correct':'wrong'}">${ok?'✓ CORRECT':'✕ NOT QUITE'}</b><p>Answer: <b>${p[2]}</b></p><p class="muted">${p[3]}</p><button class="next" id="next">${n===puzzles.length-1?'FINISH':'NEXT'}</button></div>`;$('next').onclick=()=>{n++;if(n<puzzles.length)start();else done()}}function done(){const s=VitalsArcade?.getProgress?.()||{};$('cat').textContent='CHALLENGE COMPLETE';$('q').textContent=`${score} POINTS`;$('a').remove();$('go').remove();$('result').innerHTML=`<div class="result"><b class="correct">YOUR RESULT</b><p class="muted">Streak: ${s.streak||0} · Best: ${s.bestStreak||0} · XP: ${s.xp||0}</p><button class="next" onclick="location.reload()">PLAY AGAIN</button></div>`}$('go').onclick=()=>finish(puzzles[n][2]===norm($('a').value));$('a').onkeydown=e=>{if(e.key==='Enter')$('go').click()};start();</script></body></html>
