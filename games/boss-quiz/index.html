<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss Quiz · Vitals Arcade</title><style>body{margin:0;background:#081620;color:#eaf2f2;font-family:system-ui;text-align:center}main{max-width:650px;margin:auto;padding:24px}.card{margin-top:35px;padding:28px 18px;background:#12293b;border:1px solid #24455c;border-radius:16px}.q{font-size:28px;font-weight:800;margin:30px 0}.opt{display:block;width:100%;margin:8px 0;padding:14px;border:1px solid #24455c;border-radius:10px;background:#17324a;color:#fff;font-weight:700}.boss{font-size:12px;color:#f2a93b;letter-spacing:2px}.muted{color:#7f98a3}</style></head><body><main><button onclick="location.href='../../'">← Arcade</button><div class="card"><div class="boss">BOSS QUIZ</div><div id="meta" class="muted"></div><div id="q" class="q"></div><div id="opts"></div><div id="out"></div></div></main><script src="../../shared/arcade-state.js"></script><script>const qs=[['What is the capital of Nigeria?',['Lagos','Abuja','Kano','Ibadan'],'Abuja'],['Which planet is known as the Red Planet?',['Venus','Mars','Jupiter','Mercury'],'Mars'],['What is 12 × 8?',['86','92','96','108'],'96'],['Which number is prime?',['21','27','29','33'],'29'],['Which word is closest to “rapid”?',['Slow','Quick','Quiet','Late'],'Quick']];let i=0,score=0,lives=3;function show(){const q=qs[i];document.getElementById('meta').textContent=`BOSS ${Math.min(5,i+1)} · ❤️ ${lives} · SCORE ${score}`;document.getElementById('q').textContent=q[0];document.getElementById('opts').innerHTML=q[1].map(x=>`<button class="opt" onclick="pick('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('');document.getElementById('out').textContent=''}function pick(x){const q=qs[i],ok=x===q[2];if(ok)score+=100;else lives--;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);document.getElementById('out').innerHTML=`<p>${ok?'✓ Correct':'✕ Wrong'} · Answer: <b>${q[2]}</b></p>`;if(window.VitalsArcade)VitalsArcade.recordGame('boss-quiz',score,ok);setTimeout(()=>{if(lives<=0||i===qs.length-1)done();else{i++;show()}},700)}function done(){document.getElementById('q').textContent=lives>0?'BOSS DEFEATED!':'BOSS WINS';document.getElementById('opts').innerHTML=`<button class="opt" onclick="location.reload()">FIGHT AGAIN</button>`;document.getElementById('out').innerHTML=`<p class="muted">Final score: ${score}</p>`}show();</script></body></html>
