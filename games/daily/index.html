<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Challenge · Vitals Arcade</title><link rel="stylesheet" href="../../shared/arcade-theme.css"></head><body><main><nav class="arcade-nav"><div class="game-brand">VITALS <span>ARCADE</span></div><button class="home-btn" onclick="location.href='../../'">← Arcade</button></nav><section class="game-card"><h1 class="game-title">☀️ Daily Challenge</h1><p class="game-sub">One fresh challenge each day. Your next puzzle changes tomorrow.</p><div id="kind" class="meta"></div><div class="question-card" style="text-align:center"><div id="q" style="font-size:clamp(26px,7vw,40px);font-weight:800;margin:24px 0"></div><input id="a" class="answer-input" placeholder="Your answer" autocomplete="off"><br><br><button id="go" class="arcade-btn">SUBMIT</button><div id="out"></div></div></section></main><script src="../../shared/arcade-state.js"></script><script src="../../shared/daily-challenge.js"></script><script>const c=VitalsDaily.get(),a=document.getElementById('a'),o=document.getElementById('out'),g=document.getElementById('go');document.getElementById('kind').textContent=c.puzzle.kind+' · DAILY';document.getElementById('q').textContent=c.puzzle.q;if(c.completed){a.disabled=true;g.disabled=true;o.innerHTML='<div class="result"><b class="ok">✓ COMPLETED TODAY</b><p>Come back tomorrow for a new challenge.</p></div>'}function submit(){const r=VitalsDaily.submit(a.value);if(r.correct){a.disabled=true;g.disabled=true;o.innerHTML='<div class="result"><b class="ok">⚡ DAILY COMPLETE!</b><p>+100 XP · +100 score</p><button class="arcade-btn alt" onclick="location.href=\'../../\'">BACK TO ARCADE</button></div>'}else{o.innerHTML='<div class="result"><b class="bad">Not quite.</b><p class="muted">Try again.</p></div>'}}g.onclick=submit;a.onkeydown=e=>{if(e.key==='Enter')submit()};</script></body></html>
