name: Arcade Hub Enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire shared arcade modules into hub
        shell: bash
        run: |
          set -e
          test -f index.html
          marker='<!-- VITALS_ARCADE_SHARED_MODULES -->'
          if ! grep -q "$marker" index.html; then
            python3 - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text()
marker='<!-- VITALS_ARCADE_SHARED_MODULES -->'
insert='''\n<!-- VITALS_ARCADE_SHARED_MODULES -->\n<script src="shared/arcade-state.js"></script>\n<script src="shared/achievement-popups.js"></script>\n<script src="shared/hub-enhancements.js"></script>\n'''
needle='</body>'
if needle not in s:
    raise SystemExit('index.html has no closing body tag')
p.write_text(s.replace(needle,insert+needle,1))
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git diff --cached --quiet || git commit -m 'chore: wire arcade progression into hub'
            git push
          else
            echo 'Hub already wired.'
          fi
