name: Apply Game Replacement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace original games
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def remove_var(text,name):
              start=text.index(f'var {name} = {{'); brace=text.index('{',start); depth=0; quote=None; esc=False
              for i in range(brace,len(text)):
                  c=text[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "\'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:
                              j=i+1
                              while j<len(text) and text[j].isspace(): j+=1
                              if j<len(text) and text[j]==';': j+=1
                              return text[:start]+text[j:]
              raise RuntimeError(name)
          changed=False
          for name in ('HoldSteady','BalanceTest','BreathingPacer'):
              if f'var {name} = {{' in s:
                  s=remove_var(s,name); changed=True
          a=s.index('  var GAMES = ['); b=s.index('];',a)+2
          new="""  /* Replacement games */
            var PatternBreaker={id:'pattern-breaker',title:'Pattern Breaker',tagline:'Spot the missing number before the pattern gets harder.',previewInit:function(el){el.innerHTML='<div style=\"display:flex;align-items:center;justify-content:center;height:100%;font-size:28px;font-weight:800;color:var(--trace);\">2 4 8 16 ?</div>';return function(){};},render:function(){window.location.href='games/pattern-breaker/';},cleanup:function(){}};
            var BossQuiz={id:'boss-quiz',title:'Boss Quiz',tagline:'Beat the boss by surviving a fast quiz battle.',previewInit:function(el){el.innerHTML='<div style=\"display:flex;align-items:center;justify-content:center;height:100%;font-size:28px;font-weight:800;color:var(--amber);\">👑 BOSS</div>';return function(){};},render:function(){window.location.href='games/boss-quiz/';},cleanup:function(){}};
            var NumberMerge={id:'number-merge',title:'Number Merge',tagline:'Merge matching numbers and reach the target.',previewInit:function(el){el.innerHTML='<div style=\"display:flex;align-items:center;justify-content:center;height:100%;font-size:28px;font-weight:800;color:var(--trace);\">2 + 2 = 4</div>';return function(){};},render:function(){window.location.href='games/number-merge/';},cleanup:function(){}};

          """+"  var GAMES = [HubPong, HubSolve, PatternBreaker, ReflexTest, PulseTap, SteadyHand, TapSpeed, MemoryMatch, MathRush, SequenceRecall, WordRush, OddOneOut, BossQuiz, NumberMerge];"
          if s[a:b]!=new:
              s=s[:a]+new+s[b:]; changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          assert all(x not in s for x in ('var HoldSteady = {','var BalanceTest = {','var BreathingPacer = {'))
          js=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S|re.I)
          open('/tmp/index.js','w').write('\n'.join(js))
          PY
          node --check /tmp/index.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: replace original arcade games' && git push)
