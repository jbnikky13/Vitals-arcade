name: Integrate New Games

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch arcade hub
        run: python scripts/integrate-new-games.py
      - name: Commit hub update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed."
          else
            git add index.html
            git commit -m "Add Pong and Solve in Seconds to game hub"
            git push
          fi
