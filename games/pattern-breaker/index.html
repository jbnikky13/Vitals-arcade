<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Breaker · Vitals Arcade</title><link rel="stylesheet" href="../../shared/arcade-theme.css"></head><body><main><nav class="arcade-nav"><div class="game-brand">VITALS <span>ARCADE</span></div><button class="home-btn" onclick="location.href='../../'">← Arcade</button></nav><section class="game-card"><h1 class="game-title">🔢 Pattern Breaker</h1><p class="game-sub">Find the missing value. Every new run draws a fresh set.</p><div id="meta" class="meta"></div><div class="progress-bar"><i id="bar"></i></div><div class="question-card"><div id="q" style="font-size:clamp(28px,8vw,42px);font-weight:800;text-align:center;margin:20px 0"></div><div id="opts"></div><div id="out"></div></div></section></main><script src="../../shared/arcade-state.js"></script><script>

let rounds=[],i=0,score=0;const $=id=>document.getElementById(id);function show(){const r=rounds[i];$('meta').textContent='ROUND '+(i+1)+' / '+rounds.length+' · SCORE '+score;$('bar').style.width=(i/rounds.length*100)+'%';$('q').textContent=r[0];$('out').innerHTML='';$('opts').innerHTML=r[1].sort(()=>Math.random()-.5).map(x=>'<button class="choice">'+x+'</button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(b.textContent))}
