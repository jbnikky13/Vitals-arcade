<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Rush · Vitals Arcade</title><style>body{margin:0;background:#081620;color:#eaf2f2;font-family:system-ui;text-align:center}main{max-width:640px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.card{margin-top:25px;background:#12293b;border:1px solid #24455c;border-radius:16px;padding:30px 18px;min-height:400px}.word{font-size:clamp(34px,10vw,60px);font-weight:900;letter-spacing:7px;margin:35px 0}.input{padding:13px;border-radius:10px;background:#081620;color:white;border:2px solid #24455c;font-size:18px;text-align:center;width:min(90%,320px)}button{padding:13px 22px;border:0;border-radius:10px;background:#8fe3c1;font-weight:800;margin:8px}.next{background:#f2a93b}.muted{color:#7f98a3}.result{margin-top:18px;padding:15px;border:1px solid #24455c;border-radius:12px}.ok{color:#8fe3c1}.bad{color:#ff5a4e}</style></head><body><main><header class="top"><b>VITALS ARCADE</b><button onclick="location.href='../../'">←</button></header><div id="meta" class="muted"></div><section class="card"><div class="muted">UNSCRAMBLE</div><div id="word" class="word"></div><input id="answer" class="input" autocomplete="off" placeholder="Type the word"><div><button id="submit">SOLVE</button></div><div id="result"></div></section></main><script src="../../shared/arcade-state.js"></script><script src="../../shared/arcade-enhancements.js"></script><script>const words=[['EARTH','HEART'],['APPLE','PAPER'],['LIGHT','THING'],['WATER','TOWER'],['TRAIN','INTRA'],['SMILE','LIMES'],['STONE','NOTES'],['CLOUD','COULD'],['BRAIN','BARNI'],['PLANT','PLANT']];let n=0,score=0,locked=false;const $=x=>document.getElementById(x);function shuffle(s){return s.split('').sort(()=>Math.random()-.5).join('')}function start(){locked=false;const p=words[n];$('meta').textContent=`ROUND ${n+1} / ${words.length} · SCORE ${score}`;$('word').textContent=shuffle(p[0]);$('answer').value='';$('result').innerHTML='';$('submit').disabled=false;$('answer').focus()}function submit(){if(locked)return;locked=true;$('submit').disabled=true;const p=words[n],ok=$('answer').value.trim().toUpperCase()===p[0];if(ok)score+=100;if(window.VitalsArcade)VitalsArcade.recordGame('word-rush',ok?100:0,ok);$('result').innerHTML=`<div class="result"><b class="${ok?'ok':'bad'}">${ok?'✓ CORRECT':'✕ NOT QUITE'}</b><p>Answer: <b>${p[0]}</b></p><p class="muted">${ok?'Great solve!':'Keep going — the answer is revealed so you learn the word.'}</p><button class="next" onclick="next()">${n===words.length-1?'FINISH':'NEXT'}</button></div>`}function next(){n++;if(n<words.length)start();else done()}function done(){const s=VitalsArcade.getProgress();$('word').textContent=`${score} XP`;$('answer').remove();$('submit').remove();$('meta').textContent='CHALLENGE COMPLETE';$('result').innerHTML=`<div class="result"><b class="ok">WORD RUSH COMPLETE</b><p class="muted">Streak ${s.streak||0} · Best ${s.bestStreak||0} · XP ${s.xp||0}</p><button class="next" onclick="location.reload()">PLAY AGAIN</button></div>`}$('submit').onclick=submit;$('answer').onkeydown=e=>{if(e.key==='Enter')submit()};start();</script></body></html>
