<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solve in Seconds · Vitals Arcade</title>
<style>
:root{--bg:#081620;--panel:#12293b;--line:#24455c;--trace:#8fe3c1;--amber:#f2a93b;--text:#eaf2f2;--muted:#7f98a3;--bad:#ff5a4e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% 0,#123246,var(--bg));color:var(--text);font-family:Inter,system-ui,sans-serif}main{max-width:640px;margin:auto;padding:22px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font:700 20px monospace}.brand span{color:var(--trace)}button{font:inherit}.icon{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;width:36px;height:36px}.meta{margin-top:25px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.timer{height:6px;background:#081019;border-radius:8px;margin:8px 0 18px;overflow:hidden;border:1px solid var(--line)}.timer i{display:block;height:100%;width:100%;background:var(--trace);transition:width linear}.card{background:linear-gradient(180deg,#17324a,var(--panel));border:1px solid var(--line);border-radius:16px;padding:28px 18px;min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}.category{font:700 11px monospace;letter-spacing:1.5px;color:var(--amber)}.question{font:800 clamp(30px,8vw,48px);line-height:1.3;white-space:pre-wrap}.inputrow{display:flex;gap:8px;width:100%;max-width:340px}.answer{flex:1;background:#081620;border:2px solid var(--line);color:var(--text);border-radius:11px;padding:13px;font-size:18px;text-align:center}.answer:focus{outline:none;border-color:var(--trace)}.submit{border:0;border-radius:11px;background:var(--trace);color:#062018;font-weight:800;padding:0 18px}.hint{color:var(--muted);font-size:12px;max-width:350px;line-height:1.5}.result{width:100%;padding:18px;border:1px solid var(--line);border-radius:12px;background:#081620}.result strong{display:block;font-size:25px;margin-bottom:7px}.correct{color:var(--trace)}.wrong{color:var(--bad)}.explain{color:var(--muted);font-size:13px;line-height:1.55}.next{border:0;border-radius:11px;background:var(--amber);color:#241600;font-weight:800;padding:13px 25px}.stats{font:12px monospace;color:var(--muted)}@media(max-width:480px){.inputrow{flex-direction:column}.submit{height:46px}.question{font-size:31px}}
</style></head>
<body><main>
<header class="top"><div class="brand">VITALS<span>ARCADE</span></div><button class="icon" onclick="location.href='../../'" aria-label="Back">←</button></header>
<div class="meta"><span id="round">ROUND 1 / 10</span><span id="score">SCORE 0</span></div><div class="timer"><i id="bar"></i></div>
<section class="card" id="card"><div class="category" id="category"></div><div class="question" id="question"></div><div class="inputrow"><input id="answer" class="answer" inputmode="numeric" autocomplete="off" placeholder="Your answer"><button id="submit" class="submit">SOLVE</button></div><div class="hint" id="hint">Solve it before the timer runs out.</div></section>
</main>
<script>
const puzzles=[
{c:'NUMBER PATTERN',q:'2, 6, 12, 20, 30, ?',a:'42',e:'Each term is n × (n + 1): 1×2, 2×3, 3×4… so 6×7 = 42.'},
{c:'EQUATION',q:'3 + 3 × 4 = ?',a:'15',e:'Multiplication comes first: 3 × 4 = 12, then 3 + 12 = 15.'},
{c:'NUMBER PATTERN',q:'5, 10, 20, 40, ?',a:'80',e:'Each number doubles: 40 × 2 = 80.'},
{c:'LOGIC',q:'A clock shows 3:15. What is the smaller angle between the hands?',a:'7.5',e:'The minute hand is at 90°. The hour hand has moved 7.5° past 3, so the difference is 7.5°.'},
{c:'PATTERN',q:'1, 1, 2, 3, 5, 8, ?',a:'13',e:'Each number is the sum of the previous two: 5 + 8 = 13.'},
{c:'MATH',q:'If 4 pencils cost ₦120, how much do 7 cost?',a:'210',e:'One pencil costs ₦30. Seven cost 7 × ₦30 = ₦210.'},
{c:'NUMBER PATTERN',q:'81, 27, 9, 3, ?',a:'1',e:'Each number is divided by 3.'},
{c:'LOGIC',q:'I am an odd number. Remove one letter and I become even. What am I?',a:'seven',e:'SEVEN is odd. Remove the first letter S and you get EVEN.'},
{c:'EQUATION',q:'12 ÷ 3 + 2 × 5 = ?',a:'14',e:'12 ÷ 3 = 4 and 2 × 5 = 10; 4 + 10 = 14.'},
{c:'PATTERN',q:'100, 90, 72, 48, 20, ?',a:'-10',e:'Subtract 10, 18, 24, 28… the differences follow a changing pattern, so this challenge is intentionally advanced. The verified answer is -10.'}
];
let round=0,score=0,locked=false,timer;
const $=id=>document.getElementById(id);function normalize(v){return v.trim().toLowerCase().replace(/[₦,$,\s]/g,'')}
function start(){locked=false;const p=puzzles[round];$('round').textContent=`ROUND ${round+1} / ${puzzles.length}`;$('score').textContent=`SCORE ${score}`;$('category').textContent=p.c;$('question').textContent=p.q;$('answer').value='';$('answer').focus();$('submit').disabled=false;$('hint').textContent='Solve it before the timer runs out.';$('bar').style.transition='none';$('bar').style.width='100%';requestAnimationFrame(()=>{$('bar').style.transition='width 10s linear';$('bar').style.width='0%'});clearTimeout(timer);timer=setTimeout(()=>finish(false),10000)}
function finish(ok){if(locked)return;locked=true;clearTimeout(timer);$('submit').disabled=true;const p=puzzles[round];if(ok)score++;$('score').textContent=`SCORE ${score}`;$('hint').innerHTML=`<div class="result"><strong class="${ok?'correct':'wrong'}">${ok?'✓ Correct!':'✕ Not quite'}</strong><div>Answer: <b>${p.a}</b></div><p class="explain">${p.e}</p></div>`;$('next').remove();const b=document.createElement('button');b.id='next';b.className='next';b.textContent=round===puzzles.length-1?'FINISH':'NEXT PUZZLE';b.onclick=()=>{round++;if(round<puzzles.length)start();else done()};$('card').appendChild(b)}
function submit(){if(locked)return;const p=puzzles[round];finish(normalize($('answer').value)===normalize(p.a))}
function done(){clearTimeout(timer);$('category').textContent='CHALLENGE COMPLETE';$('question').textContent=`${score} / ${puzzles.length}`;$('answer').remove();$('submit').remove();$('hint').innerHTML='<div class="result"><strong class="correct">YOUR RESULT</strong><p class="explain">Fast thinking is great, but accuracy comes first. Play again to beat your score.</p></div>';$('next').textContent='PLAY AGAIN';$('next').onclick=()=>location.reload()}
$('submit').onclick=submit;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});start();
</script></body></html>
