<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Challenge · Vitals Arcade</title><style>body{margin:0;background:#081620;color:#eaf2f2;font-family:system-ui;text-align:center}main{max-width:620px;margin:auto;padding:24px}.card{margin-top:40px;padding:30px 20px;background:#12293b;border:1px solid #24455c;border-radius:16px}.q{font-size:34px;font-weight:800;margin:28px 0}.a{padding:14px;border:2px solid #24455c;border-radius:10px;background:#081620;color:white;font-size:18px;text-align:center}.btn{padding:14px 22px;border:0;border-radius:10px;background:#8fe3c1;font-weight:800}.muted{color:#7f98a3}.ok{color:#8fe3c1}.bad{color:#ff5a4e}</style></head><body><main><button onclick="location.href='../../'">← Arcade</button><div class="card"><div id="kind" class="muted"></div><div id="q" class="q"></div><input id="a" class="a" placeholder="Your answer" autocomplete="off"><br><br><button id="go" class="btn">SUBMIT</button><div id="out"></div></div></main><script src="../../shared/arcade-state.js"></script><script src="../../shared/daily-challenge.js"></script><script>const c=VitalsDaily.get();document.getElementById('kind').textContent=c.puzzle.kind+' · DAILY';document.getElementById('q').textContent=c.puzzle.q;const a=document.getElementById('a'),o=document.getElementById('out'),g=document.getElementById('go');if(c.completed){a.disabled=true;g.disabled=true;o.innerHTML='<p class="ok"><b>✓ COMPLETED TODAY</b></p><p class="muted">Come back tomorrow for a new challenge.</p>'}function submit(){const r=VitalsDaily.submit(a.value);if(r.correct){a.disabled=true;g.disabled=true;o.innerHTML='<p class="ok"><b>⚡ DAILY COMPLETE!</b></p><p>+100 XP · +100 score</p><button class="btn" onclick="location.href=\'../../\'">BACK TO ARCADE</button>'}else{o.innerHTML='<p class="bad"><b>Not quite.</b></p><p class="muted">Try again.</p>'}}g.onclick=submit;a.onkeydown=e=>{if(e.key==='Enter')submit()};</script></body></html>
